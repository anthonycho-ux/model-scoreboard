<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Model Scoreboard</title>
<style>
:root{--bg:#14171c;--panel:#1d2129;--panel2:#232833;--line:#2a2f3a;--blue:#3b6df0;--amber:#d8b06a;--muted:#9aa3b2;--text:#e8ecf1;--green:#6fdc9b;--red:#e06a6a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.35;padding:20px 24px;font-size:13px}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:20px;margin-bottom:4px}.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.bar{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:14px;flex-wrap:wrap}
.bar .lbl{color:var(--muted);font-size:11px}.bar input[type=range]{width:100px;accent-color:var(--blue)}
.bar .rv{color:var(--amber);font-weight:600;font-size:11px;width:32px}
.bar select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:5px 6px;font-size:12px}
.bar input[type=text]{flex:1;min-width:110px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:5px 8px;font-size:12px}
.tgl{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px}
.tgl button{border:none;background:transparent;color:var(--muted);padding:4px 9px;border-radius:5px;font-size:11px;cursor:pointer}
.tgl button.on{background:var(--blue);color:#fff}.bar .spacer{flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;user-select:none;white-space:nowrap}
th.num{text-align:right}td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
td.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}td.num{text-align:right}
tr.me td{background:rgba(216,176,106,.07)}
.ratio{font-weight:700;color:var(--green)}.ratio-w{font-weight:700;color:var(--amber)}
.tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:9px;margin-left:6px;vertical-align:middle}
.tag.me{background:var(--amber);color:#14171c}.tag.free{background:var(--green);color:#14171c}
.score-col{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.score-bar{height:7px;border-radius:3px;min-width:50px;background:var(--line)}
.cnt{color:var(--muted);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:14px}
.note{color:var(--muted);font-size:11px;margin-top:12px;line-height:1.6}
.verdict{background:rgba(111,220,155,.1);border:1px solid var(--green);border-radius:9px;padding:11px 14px;margin-bottom:14px;font-size:12px}.verdict b{color:var(--green)}
.metric-desc{color:var(--muted);font-size:12px;margin-bottom:12px;line-height:1.6}
</style></head><body><div class="wrap">
<h1>Model Scoreboard</h1>
<div class="sub">Pick your intelligence yardstick, rank models by intelligence over cost, judge in seconds.</div>
<div class="bar">
<span class="lbl">metric</span>
<select id="metric">
<option value="composite">composite index</option>
<option value="intelligence" selected>intelligence index</option>
<option value="coding">coding index</option>
<option value="agentic">agentic index</option>
</select>
<span class="lbl">cache k</span><input type="range" id="cached" min="0" max="200" step="4" value="80"><span class="rv" id="cached-v">80k</span>
<span class="lbl">fresh k</span><input type="range" id="fresh" min="0" max="64" step="1" value="4"><span class="rv" id="fresh-v">4k</span>
<span class="lbl">out k</span><input type="range" id="out" min="0" max="64" step="1" value="4"><span class="rv" id="out-v">4k</span>
<input type="text" id="q" placeholder="search">
<select id="sort"><option value="ratio">sort intel/cost</option><option value="intel">sort score</option><option value="cost">sort cost</option></select>
<div class="tgl" id="reason-tgl"><button class="on" data-v="all">all</button><button data-v="yes">reason</button><button data-v="no">non</button></div>
</div>
<div class="metric-desc" id="mdesc"></div>
<div class="verdict" id="verdict"></div>
<div class="card">
<div class="cnt" id="cnt" style="margin-bottom:8px"></div>
<table><thead><tr>
<th>rank</th><th>model</th><th class="num" onclick="setSort('intel')">score</th><th class="num" onclick="setSort('cost')">cost/call</th><th class="num" onclick="setSort('ratio')">score/cost</th><th class="num" onclick="setSort('ctx')">ctx</th>
</tr></thead><tbody id="body"></tbody></table>
<div class="note" id="foot"></div>
</div>
</div>
<script>
const $=s=>document.querySelector(s);let ROWS=[];
const fmtMoney=n=>'$'+(n<0.01?n.toFixed(4):n.toFixed(2));
const fmtK=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'k':Math.round(n);
const DESC={
 composite:'Composite index: the mean of the intelligence, coding, and agentic sub-indices, one balanced number. Requires all three scores, so the field is the narrowest but most rounded.',
 intelligence:'Artificial Analysis Intelligence Index: weighted average of nine evals across agents, coding, scientific reasoning, and general. The flagship overall capability score.',
 coding:'Artificial Analysis Coding Index: how well a model writes and fixes code. Higher than the intelligence index on most coding models.',
 agentic:'Artificial Analysis Agentic Index: how well a model carries out long-horizon agent tasks with tools. The most task-relevant for autonomous work.'
};
async function load(){try{const c=$('#cached').value,f=$('#fresh').value,o=$('#out').value,m=$('#metric').value;const r=await fetch('/api/scoreboard?cached='+c+'&fresh='+f+'&out='+o+'&metric='+m);if(!r.ok)throw 0;const d=await r.json();ROWS=d.rows||[];render();}catch(e){$('#body').innerHTML='<tr><td colspan=6 class="note">failed to load</td></tr>';}}
let sortKey='ratio';
function setSort(k){sortKey=k;render();}
function filtered(){const q=($('#q').value||'').toLowerCase();const rv=document.querySelector('#reason-tgl button.on').dataset.v;return ROWS.filter(m=>{if(q&&!(m.id||'').toLowerCase().includes(q)&&!(m.name||'').toLowerCase().includes(q))return false;if(rv==='yes'&&!m.reasoning)return false;if(rv==='no'&&m.reasoning)return false;return true;});}
function render(){$('#mdesc').textContent=DESC[$('#metric').value]||'';const rows=filtered().slice();rows.sort((a,b)=>{if(sortKey==='ratio'){const ar=a.ratio==null?-1:a.ratio,br=b.ratio==null?-1:b.ratio;return br-ar;}if(sortKey==='intel')return b.score-a.score;if(sortKey==='cost')return a.cost-b.cost;if(sortKey==='ctx')return b.ctx-a.ctx;return 0;});$('#cnt').textContent=rows.length+' of '+ROWS.length+' scored';const maxSc=Math.max(...rows.map(r=>r.score).filter(n=>!isNaN(n)),1);let h='';rows.forEach((r,i)=>{const isMe=r.id==='deepseek/deepseek-v4-flash-0731';const ratioText=r.ratio==null?'<span class="note">free</span>':r.ratio.toLocaleString(undefined,{maximumFractionDigits:0});const barW=Math.max(6,(r.score/maxSc)*100);const tags=(isMe?'<span class="tag me">yours</span>':'')+(r.free?'<span class="tag free">free</span>':'');h+='<tr class="'+(isMe?'me':'')+'"><td class="num" style="color:var(--muted)">'+(i+1)+'</td><td class="mono">'+r.id.split('/').pop()+tags+'</td><td class="num"><div class="score-col"><div class="score-bar" style="width:'+barW+'%"></div>'+r.score.toFixed(1)+'</div></td><td class="num">'+fmtMoney(r.cost)+'</td><td class="num '+(r.ratio!=null&&r.ratio>10000?'ratio':'ratio-w')+'">'+ratioText+'</td><td class="num">'+fmtK(r.ctx)+'</td></tr>';});$('#body').innerHTML=h;const me=rows.find(r=>r.id==='deepseek/deepseek-v4-flash-0731');if(me){const rText=me.ratio!=null?me.ratio.toLocaleString(undefined,{maximumFractionDigits:0}):'free';$('#verdict').innerHTML='<b>Your model: '+me.id.split('/').pop()+'</b> — score '+me.score.toFixed(1)+' on '+$('#metric').value+', cost '+fmtMoney(me.cost)+'/call, score/cost '+rText+'. Ranked against '+rows.length+' scored models.';}else{$('#verdict').innerHTML='';}}
$('#metric').addEventListener('change',load);$('#cached').addEventListener('input',()=>{$('#cached-v').textContent=Math.round($('#cached').value)+'k';load();});
$('#fresh').addEventListener('input',()=>{$('#fresh-v').textContent=Math.round($('#fresh').value)+'k';load();});
$('#out').addEventListener('input',()=>{$('#out-v').textContent=Math.round($('#out').value)+'k';load();});
$('#q').addEventListener('input',render);$('#sort').addEventListener('change',e=>setSort(e.target.value));
document.querySelectorAll('#reason-tgl button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#reason-tgl button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();}));
load();
</script></body></html>
